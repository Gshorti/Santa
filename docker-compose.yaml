services:
  user-service:
      build:
        context: .
      volumes:
        - ./:/Santa
      ports:
        - "4444:4444"
      environment:
        - DB_HOST=db
        - DB_NAME=${DB_NAME}
        - DB_USER=${DB_USER}
        - DB_PASS=${DB_PASS}
        - DB_PORT=5432
        - BOT_TOKEN=${TOKEN}
        - ADR=${ADR}

      command: >
        sh -c "oscript Сервер.os"
      depends_on:
        db:
          condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    command: postgres -c max_connections=4000
    healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
          interval: 5s
          timeout: 5s
          retries: 5

  files:
    image: nginx:latest
    ports:
      - "7777:80"
    volumes:
      - ./uploads/:/usr/share/nginx/html/files/
    command: >
        nginx -g "daemon off;"
